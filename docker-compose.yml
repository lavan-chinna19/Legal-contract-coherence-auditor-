version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: auditor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-auditor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditor_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor_user} -d ${POSTGRES_DB:-legal_auditor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - auditor_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: auditor_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - auditor_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: auditor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor_user}:${POSTGRES_PASSWORD:-auditor_secure_pass}@postgres:5432/${POSTGRES_DB:-legal_auditor}
      API_KEY: ${API_KEY:-dev_auditor_key_12345}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET_NAME: contract-uploads
      RETENTION_TTL_SECONDS: ${RETENTION_TTL_SECONDS:-86400}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - auditor_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditor_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
      API_KEY: ${API_KEY:-dev_auditor_key_12345}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - auditor_network

volumes:
  postgres_data:
  minio_data:
  uploads_data:

networks:
  auditor_network:
    driver: bridge
