services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-auditor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [auditor_network]

  # Optional legacy service. The API uses encrypted uploads_data, not S3.
  minio:
    profiles: [legacy-object-storage]
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [auditor_network]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-legal_auditor}
      API_KEY: ${API_KEY:?Set a private API_KEY}
      API_KEYS: ${API_KEYS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set a stable Fernet key}
      RETENTION_TTL_SECONDS: ${RETENTION_TTL_SECONDS:-86400}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-200}
      CORS_ORIGINS: http://127.0.0.1:${LEXAUDIT_FRONTEND_PORT:-3001},http://localhost:${LEXAUDIT_FRONTEND_PORT:-3001}
      LEXAUDIT_ALLOW_MODEL_DOWNLOAD: "0"
      LEXAUDIT_UPLOAD_DIR: /app/data/uploads
      LEXAUDIT_EMBEDDINGS_CACHE_DIR: /app/data/processed/embeddings_cache
      LEXAUDIT_THRESHOLDS_PATH: /app/data/feedback/thresholds.json
    volumes:
      - uploads_data:/app/data/uploads
      - embeddings_data:/app/data/processed/embeddings_cache
      - feedback_files:/app/data/feedback
      - model_cache:/opt/hf/hub:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 20s
      timeout: 180s
      start_period: 240s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 6g
    cpus: 2
    networks: [auditor_network]

  model-setup:
    profiles: [tools]
    image: lexaudit-release-backend
    user: "0:0"
    network_mode: none
    entrypoint: ["python", "/app/src/deployment/seed_model_cache.py"]
    volumes:
      - model_cache:/opt/hf/hub
      - type: bind
        source: ${LEXAUDIT_LEGALBERT_DIR:?Set the existing public Legal-BERT cache directory}
        target: /seed
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEXAUDIT_BACKEND_PORT:-8011}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    networks: [ingress_network, auditor_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${LEXAUDIT_BACKEND_PORT:-8011}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${LEXAUDIT_FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    networks: [ingress_network]

volumes:
  postgres_data:
  minio_data:
  uploads_data:
  embeddings_data:
  feedback_files:
  model_cache:

networks:
  ingress_network:
    driver: bridge
  auditor_network:
    internal: true
    driver: bridge
