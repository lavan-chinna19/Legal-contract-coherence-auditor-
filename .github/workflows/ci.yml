name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test-backend:
    name: Backend Test Suite & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
          python -m spacy download en_core_web_sm

      - name: Execute Security & API Integration Tests
        env:
          API_KEY: ci_test_key_secret_12345
        run: |
          pytest -v tests/test_security.py tests/test_api_integration.py

      - name: Execute Prompt 17 & 18 Verification Gates
        env:
          API_KEY: ci_test_key_secret_12345
        run: |
          python verify_prompt_17.py
          python verify_prompt_18.py

  build-and-test-frontend:
    name: Frontend Build & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Dockerfile & Compose Syntax Verification
    runs-on: ubuntu-latest
    needs: [lint-and-test-backend, build-and-test-frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Syntax
        run: docker compose config -q
